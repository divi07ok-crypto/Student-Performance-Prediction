
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Performance AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; background: linear-gradient(135deg, #171b45, #5145b8, #8874e9);
        }
        .login-card {
            width: 100%; max-width: 420px; background: white;
            padding: 38px; border-radius: 20px; box-shadow: 0 20px 55px #10103355;
        }
        .logo { text-align: center; font-size: 22px; font-weight: 800; color: #24234c; }
        .logo span { color: #7565db; }
        .icon {
            width: 65px; height: 65px; display: grid; place-items: center;
            background: #efedff; color: #5948c5; border-radius: 18px;
            font-size: 28px; margin: 25px auto 18px;
        }
        h1 { text-align: center; font-size: 25px; color: #24243d; }
        .subtitle { text-align: center; color: #8a8da0; font-size: 13px; margin: 9px 0 28px; }
        label { display: block; color: #555a70; font-size: 13px; font-weight: 600; margin: 17px 0 8px; }
        input {
            width: 100%; padding: 13px 14px; border: 1px solid #e0e2ed;
            border-radius: 9px; outline: none; font-size: 14px; background: #fafaff;
        }
        input:focus { border-color: #7565db; box-shadow: 0 0 0 3px #7565db18; }
        button {
            width: 100%; margin-top: 25px; padding: 14px; border: none;
            border-radius: 9px; background: linear-gradient(100deg, #5145b8, #8874e9);
            color: white; font-size: 15px; font-weight: 700; cursor: pointer;
        }
        button:hover { opacity: .92; }
        .links { text-align: center; margin-top: 24px; font-size: 13px; color: #85899c; }
        a { color: #6554ce; text-decoration: none; font-weight: 600; }
        .flash { background: #fff0f0; color: #b42332; padding: 11px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
        .success { background: #eafaf1; color: #16834b; }
        .staff-note { text-align: center; font-size: 11px; color: #999caf; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">PERFORMANCE<span>AI</span></div>
        <div class="icon">👨‍💼</div>
        <h1>Staff Login</h1>
        <p class="subtitle">Sign in to monitor student performance</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {% if category == 'success' %}success{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('staff_login') }}" method="POST" autocomplete="off">
            <label for="email">Staff Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter staff email"
                value=""
                autocomplete="off"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter staff password"
                value=""
                autocomplete="new-password"
                required
            >

            <button type="submit">Login to Staff Portal →</button>
        </form>

        <p class="staff-note">Authorized staff access only</p>

        <div class="links">
            <a href="{{ url_for('login') }}">← Back to Login Selection</a>
        </div>
    </div>
</body>
</html>
